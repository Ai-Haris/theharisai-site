<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swiss Abstract</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800;900&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@500;700&display=block">
<style>
/* Layout: a single-column studio player. Stage first, transport under it, then the "make it yours" media row. One dark look by choice. */
:root {
  color-scheme: dark;
  --bg: #0d0d11;
  --panel: #16161c;
  --ink: #f2f0eb;
  --dim: #9896a2;
  --line: #2b2a33;
  --accent: #e2571e;
  --on-accent: #ffffff;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); margin: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 28px; }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 14px; }
.wrap.tall { max-width: 520px; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.top h1 { margin: 0; font-size: clamp(22px, 3.4vw, 32px); line-height: 1.1; letter-spacing: -0.01em; }
.top h1 span { color: var(--accent); }
.meta { margin: 0; color: var(--dim); font-size: 14px; }
.stage { position: relative; width: 100%; max-width: 100%; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.stage canvas { display: block; width: 100%; height: auto; }
.bar, .mine { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.mine .lab { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); margin-right: 4px; }
button, label.btn { font: 600 14px var(--ui); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
button:hover, label.btn:hover { border-color: var(--dim); }
button:focus-visible, label.btn:focus-within, input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
#play { min-width: 84px; justify-content: center; background: var(--ink); color: #0d0d11; border-color: var(--ink); }
#scrub { flex: 1 1 200px; min-width: 0; accent-color: var(--accent); }
#time { font: 600 14px var(--ui); font-variant-numeric: tabular-nums; color: var(--dim); min-width: 96px; text-align: right; }
.file { position: absolute; width: 1px; height: 1px; opacity: 0; }
.note { margin: 0; color: var(--dim); font-size: 13px; max-width: 75ch; line-height: 1.5; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="wrap" id="wrap">
  <div class="top">
    <h1>Swiss <span>Abstract</span></h1>
    <p class="meta" id="meta">Minimal Type · drawn in code, sound synthesized · HX engine</p>
  </div>
  <div class="stage"><canvas id="stage" width="1280" height="720" aria-label="Swiss Abstract animation"></canvas></div>
  <div class="bar">
    <button id="play" type="button">Play</button>
    <input id="scrub" type="range" min="0" max="20" step="0.01" value="0" aria-label="Scrub timeline">
    <span id="time">0.00 / 0.00</span>
    <button id="sound" type="button" aria-pressed="true">Sound on</button>
    <button id="loop" type="button" aria-pressed="true">Loop</button>
  </div>
  <div class="mine">
    <span class="lab">Make it yours</span>
    <button id="faceOn" type="button" aria-pressed="false">Facecam</button>
    <button id="shotOn" type="button" aria-pressed="false">Brand UI</button>
    <label class="btn" for="vofile">Load voiceover<input class="file" id="vofile" type="file" accept="audio/*"></label>
    <label class="btn" for="facefile">Load facecam<input class="file" id="facefile" type="file" accept="video/*"></label>
    <label class="btn" for="shotfile">Load screenshot<input class="file" id="shotfile" type="file" accept="image/*"></label>
  </div>
  <p class="note" id="note">Turn on Facecam or Brand UI to see where your camera and your own screenshot go. Load your files to preview them in sync. A facecam clip with sound also works as the voiceover.</p>
</div>

<script>
/* =====================================================================================================
   HX MOTION ENGINE v1.1  ·  Haris AI Style Library  ·  theharisai.com
   A small engine for code-drawn animated videos. Every frame is a pure function of time t.
   Sections:  1 HX (math, random, easing, text, shapes, finishing)   2 SND (synthesized sound + music)
              3 MEDIA (facecam + brand screenshot slots)             4 STAGE (scene compositor + transitions)
   A style only defines one STYLE object (see the STYLE block). The PLAYER block wires the page.
   Rule: never use Math.random. All randomness comes from HX.rand(seed) and HX.noise(seed).
   v1.1: render scale HX.R (1.5 = 1920x1080 from 1280x720 logic). Cached layers use HX.layer(w, h) and are drawn with
         HX.blit(c, L, x, y[, w, h]) so they stay sharp. New finishing fx: bloom, leak, bokeh, burst, ring, flare, drift.
   ===================================================================================================== */

// ----------------------------------------------- 1 · HX -----------------------------------------------
const HX = (() => {
  const cl = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));
  const mix = (a, b, u) => a + (b - a) * u;
  const prog = (t, a, b) => cl((t - a) / (b - a));
  const bell = (t, a, b) => Math.sin(Math.PI * prog(t, a, b));
  const fnv = (s) => { s = String(s); let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  // sfc32 generator seeded from any string or number
  const rand = (seed) => {
    let a = fnv('a' + seed), b = fnv('b' + seed), c = fnv('c' + seed), d = 1;
    const f = () => { a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0; let t = (a + b) | 0; a = b ^ (b >>> 9); b = (c + (c << 3)) | 0; c = (c << 21) | (c >>> 11); d = (d + 1) | 0; t = (t + d) | 0; c = (c + t) | 0; return (t >>> 0) / 4294967296; };
    for (let i = 0; i < 12; i++) f();
    f.range = (lo, hi) => lo + f() * (hi - lo); f.pick = (arr) => arr[Math.floor(f() * arr.length)]; f.sign = () => (f() < 0.5 ? -1 : 1);
    return f;
  };
  // smooth 2D value noise in -1..1, quintic fade
  const fade = (u) => u * u * u * (u * (u * 6 - 15) + 10);
  const lattice = (x, y, s) => { let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ s; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  const noise = (seed = 0) => { const s = fnv('n' + seed); return (x, y = 0) => { const xi = Math.floor(x), yi = Math.floor(y), u = fade(x - xi), v = fade(y - yi); return mix(mix(lattice(xi, yi, s), lattice(xi + 1, yi, s), u), mix(lattice(xi, yi + 1, s), lattice(xi + 1, yi + 1, s), u), v) * 2 - 1; }; };
  const E = {
    lin: (u) => u,
    sine: (u) => 0.5 - 0.5 * Math.cos(Math.PI * u),
    out2: (u) => 1 - (1 - u) * (1 - u),
    out3: (u) => 1 - Math.pow(1 - u, 3),
    in3: (u) => u * u * u,
    io3: (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(2 - 2 * u, 3) / 2),
    out5: (u) => 1 - Math.pow(1 - u, 5),
    expo: (u) => (u >= 1 ? 1 : 1 - Math.pow(2, -11 * u)),
    ioExpo: (u) => (u <= 0 ? 0 : u >= 1 ? 1 : u < 0.5 ? Math.pow(2, 20 * u - 10) / 2 : (2 - Math.pow(2, -20 * u + 10)) / 2),
    over: (u, k = 1.8) => { if (u <= 0) return 0; if (u >= 1) return 1; const v = u - 1; return 1 + v * v * ((k + 1) * v + k); },
    spring: (u, f = 12, d = 5.5) => (u <= 0 ? 0 : u >= 1 ? 1 : 1 - Math.exp(-d * u) * Math.cos(f * u)),
    bounce: (u) => { const n = 7.5625, k = 2.75; if (u < 1 / k) return n * u * u; if (u < 2 / k) return n * (u -= 1.5 / k) * u + 0.75; if (u < 2.5 / k) return n * (u -= 2.25 / k) * u + 0.9375; return n * (u -= 2.625 / k) * u + 0.984375; },
  };
  // ez(t, start, end, 'name', extra) = eased progress of t through [start, end]
  const ez = (t, a, b, name = 'out3', k) => E[name](prog(t, a, b), k);
  const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
  // a cached layer in logical units, stored at render scale R so it stays sharp at 1080p
  const layer = (w, h) => { const R = API.R, c = canvas(w * R, h * R); c.lw = w; c.lh = h; c.getContext('2d').setTransform(R, 0, 0, R, 0, 0); return c; };
  const blit = (c, L, x, y, w, h) => c.drawImage(L, x, y, w == null ? (L.lw || L.width) : w, h == null ? (L.lh || L.height) : h);
  // source rect in logical units
  const blitPart = (c, L, sx, sy, sw, sh, dx, dy, dw, dh) => { const k = L.lw ? L.width / L.lw : 1; c.drawImage(L, sx * k, sy * k, sw * k, sh * k, dx, dy, dw, dh); };
  const base = (c) => c.setTransform(API.R, 0, 0, API.R, 0, 0);
  // keyframes: key([[t, v], [t, v, 'ease'], ...])(t)
  const key = (pts) => (t) => {
    if (t <= pts[0][0]) return pts[0][1];
    for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]) { const [t0, v0] = pts[i - 1], [t1, v1, e] = pts[i]; return mix(v0, v1, E[e || 'io3'](prog(t, t0, t1))); }

  };
  // camera kicks: list of { t, a (amount), k (decay) }
  const kick = (t, list, decay = 4) => { let z = 0; for (const q of list) { const d = t - q.t; if (d < 0) continue; z += q.a * (d < 0.05 ? d / 0.05 : Math.exp(-(d - 0.05) * (q.k || decay))); } return z; };

  const cam = (c, W, H, o) => { c.translate(W / 2 + (o.x || 0), H / 2 + (o.y || 0)); if (o.r) c.rotate(o.r); c.scale(o.z || 1, o.z || 1); c.translate(-(o.fx == null ? W / 2 : o.fx), -(o.fy == null ? H / 2 : o.fy)); };
  const path = {
    rr: (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); },
    poly: (c, pts) => { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath(); },
    ngon: (c, cx, cy, r, n, rot = 0) => { c.beginPath(); for (let i = 0; i < n; i++) { const a = rot + (i / n) * Math.PI * 2; i ? c.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r) : c.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } c.closePath(); },
    star: (c, cx, cy, ro, ri, n, rot = -Math.PI / 2) => { c.beginPath(); for (let i = 0; i < n * 2; i++) { const a = rot + (i * Math.PI) / n, r = i % 2 ? ri : ro; i ? c.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r) : c.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } c.closePath(); },
  };
  const txt = {
    font: (weight, px, family) => `${weight} ${px}px ${family}`,
    width: (c, s, font, track = 0) => { c.font = font; c.letterSpacing = track + 'px'; const w = c.measureText(s).width; c.letterSpacing = '0px'; return w; },
    // draw text with options { font, fill, stroke, lw, align, base, track, alpha }
    draw: (c, s, x, y, o) => {
      c.save(); c.font = o.font; c.letterSpacing = (o.track || 0) + 'px'; c.textAlign = o.align || 'center'; c.textBaseline = o.base || 'middle';
      if (o.alpha != null) c.globalAlpha *= o.alpha;
      if (o.stroke) { c.lineJoin = 'round'; c.lineWidth = o.lw || 4; c.strokeStyle = o.stroke; c.strokeText(s, x, y); }
      if (o.fill) { c.fillStyle = o.fill; c.fillText(s, x, y); }
      c.restore();
    },
    // largest px (up to max) at which s fits width w
    fit: (c, s, w, max, weight, family, track = 0) => { const at = txt.width(c, s, `${weight} 100px ${family}`, track * 1); return Math.min(max, Math.floor((100 * w) / Math.max(1, at))); },
    // per-letter layout: returns [{ ch, x (center offset from the word's left edge), w }] and total width
    letters: (c, s, font, track = 0) => { c.font = font; c.letterSpacing = '0px'; let x = 0; const out = []; for (const ch of s) { const w = c.measureText(ch).width; out.push({ ch, x: x + w / 2, w }); x += w + track; } c.letterSpacing = '0px'; return { list: out, w: x - track }; },
    wrap: (c, s, font, maxW) => { c.font = font; const out = []; let line = ''; for (const w of s.split(' ')) { const test = line ? line + ' ' + w : w; if (c.measureText(test).width > maxW && line) { out.push(line); line = w; } else line = test; } if (line) out.push(line); return out; },
  };
  let GR = null; const SM = {}; let SOFT = null;
  const small = (k, w, h) => { const c = SM[k]; if (c && c.width === w && c.height === h) return c; return (SM[k] = canvas(w, h)); };
  // soft round sprite (white), used for bokeh, glows and particles
  const soft = () => { if (SOFT) return SOFT; SOFT = canvas(128, 128); const x = SOFT.getContext('2d'), g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.35, 'rgba(255,255,255,0.55)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 128, 128); return SOFT; };
  const TINT = new Map();
  const tinted = (col) => { if (TINT.has(col)) return TINT.get(col); const L = canvas(128, 128), x = L.getContext('2d'); x.drawImage(soft(), 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = col; x.fillRect(0, 0, 128, 128); TINT.set(col, L); return L; };
  const fx = {
    // film or print grain, stepped at fps
    grain: (c, t, W, H, alpha = 0.06, fps = 12, mode = 'overlay') => {
      if (!GR) { GR = []; for (let g = 0; g < 3; g++) { const L = canvas(256, 256), x = L.getContext('2d'), img = x.createImageData(256, 256), r = rand('grain' + g); for (let i = 0; i < img.data.length; i += 4) { const v = 128 + (r() + r() - 1) * 115; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; } x.putImageData(img, 0, 0); GR.push(L); } }
      const f = Math.floor(t * fps), r = rand('gs' + f), pat = c.createPattern(GR[f % 3], 'repeat');
      pat.setTransform(new DOMMatrix().scaleSelf(1 / API.R).translateSelf(-r() * 256, -r() * 256));
      c.save(); base(c); c.globalAlpha = alpha; c.globalCompositeOperation = mode; c.fillStyle = pat; c.fillRect(0, 0, W, H); c.restore();
    },
    vignette: (c, W, H, strength = 0.35, color = '0,0,0') => {
      const g = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.6);
      g.addColorStop(0, `rgba(${color},0)`); g.addColorStop(1, `rgba(${color},${strength})`);
      c.save(); base(c); c.fillStyle = g; c.fillRect(0, 0, W, H); c.restore();
    },
    flash: (c, t, W, H, list) => { for (const f of list) { const d = t - f.t; if (d < 0 || d > 0.45) continue; c.save(); base(c); c.fillStyle = `rgba(${f.col || '255,255,255'},${f.a * Math.exp(-d * 10)})`; c.fillRect(0, 0, W, H); c.restore(); } },
    // bloom: bright parts glow. o = { strength, radius, lift (how much midtones glow, 0..1), mode }
    bloom: (c, o = {}) => {
      const cv = c.canvas, st = o.strength == null ? 0.55 : o.strength, rad = o.radius || 16, lift = o.lift == null ? 0.35 : o.lift;
      const w1 = Math.max(8, Math.round(cv.width / 4)), h1 = Math.max(8, Math.round(cv.height / 4)), A = small('b1', w1, h1), a = A.getContext('2d');
      const thr = `brightness(${0.55 + lift * 0.5}) contrast(${2.6 - lift * 1.4}) saturate(1.25)`;
      a.setTransform(1, 0, 0, 1, 0, 0); a.globalCompositeOperation = 'copy'; a.filter = `${thr} blur(${(rad / 4) * (cv.width / 1280)}px)`; a.drawImage(cv, 0, 0, w1, h1); a.filter = 'none';
      const w2 = Math.max(4, w1 >> 1), h2 = Math.max(4, h1 >> 1), B = small('b2', w2, h2), b = B.getContext('2d');
      b.setTransform(1, 0, 0, 1, 0, 0); b.globalCompositeOperation = 'copy'; b.filter = `blur(${(rad / 6) * (cv.width / 1280)}px)`; b.drawImage(A, 0, 0, w2, h2); b.filter = 'none';
      c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = o.mode || 'screen'; c.globalAlpha = st; c.drawImage(A, 0, 0, cv.width, cv.height); c.globalAlpha = st * 0.8; c.drawImage(B, 0, 0, cv.width, cv.height); c.restore();
    },
    // drifting colored light leaks. cols: ['255,120,80', ...]
    leak: (c, t, W, H, cols, a = 0.25, seed = 'leak') => {
      const N = noise(seed); c.save(); base(c); c.globalCompositeOperation = 'screen';
      cols.forEach((col, i) => { const x = W * (0.5 + 0.55 * N(t * 0.12 + i * 3.1, 1)), y = H * (0.5 + 0.55 * N(t * 0.1 + i * 5.7, 2)), R = Math.max(W, H) * (0.45 + 0.15 * N(t * 0.2, i)); const g = c.createRadialGradient(x, y, 0, x, y, R); g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`); c.fillStyle = g; c.fillRect(0, 0, W, H); });

    },
    // floating out-of-focus particles for depth. o = { n, col, min, max, speed, alpha, seed, mode }
    bokeh: (c, t, W, H, o = {}) => {
      const r = rand(o.seed || 'bk'), L = tinted(o.col || '#ffffff'), n = o.n || 24; c.save(); c.globalCompositeOperation = o.mode || 'screen';
      for (let i = 0; i < n; i++) { const s = r.range(o.min || 10, o.max || 60), sp = r.range(0.3, 1) * (o.speed || 14), x0 = r.range(-60, W + 60), y = ((r.range(0, H + 200) - t * sp) % (H + 200) + H + 200) % (H + 200) - 100, x = x0 + Math.sin(t * 0.4 + i) * 14, tw = 0.55 + 0.45 * Math.sin(t * r.range(0.5, 1.5) + i);
        c.globalAlpha = (o.alpha == null ? 0.35 : o.alpha) * tw; c.drawImage(L, x - s, y - s, s * 2, s * 2); }
      c.restore();
    },
    // particle burst at hit time t0 from (x, y). Pure function of t.
    // o = { n, seed, cols, speed, spread (radians), dir, gravity, drag, life, size, kind: 'spark' | 'dot' | 'confetti' | 'glow' }
    burst: (c, t, t0, x, y, o = {}) => {
      const d = t - t0, life = o.life || 0.9; if (d < 0 || d > life * 1.4) return;
      const r = rand((o.seed || 'p') + t0), n = o.n || 26, cols = o.cols || ['#ffffff'], g = o.gravity == null ? 600 : o.gravity, k = o.drag == null ? 2.6 : o.drag, kind = o.kind || 'spark';
      c.save(); c.globalCompositeOperation = o.mode || (kind === 'confetti' ? 'source-over' : 'lighter'); c.lineCap = 'round';
      for (let i = 0; i < n; i++) {
        const a = (o.dir || 0) + (r() - 0.5) * (o.spread == null ? Math.PI * 2 : o.spread), v = (o.speed || 700) * r.range(0.35, 1), li = life * r.range(0.6, 1.2), col = cols[i % cols.length], sz = (o.size || 4) * r.range(0.5, 1.3), rot0 = r() * 7;
        if (d > li) continue; const e = (1 - Math.exp(-k * d)) / k, px = x + Math.cos(a) * v * e, py = y + Math.sin(a) * v * e + 0.5 * g * d * d * 0.6, fade = 1 - d / li;
        const vx = Math.cos(a) * v * Math.exp(-k * d), vy = Math.sin(a) * v * Math.exp(-k * d) + g * d * 0.6;
        c.globalAlpha = fade;
        if (kind === 'spark') { const L = Math.min(60, Math.hypot(vx, vy) * 0.035) + sz; const m = Math.hypot(vx, vy) || 1; c.strokeStyle = col; c.lineWidth = sz * 0.7; c.beginPath(); c.moveTo(px, py); c.lineTo(px - (vx / m) * L, py - (vy / m) * L); c.stroke(); }
        else if (kind === 'confetti') { c.fillStyle = col; c.save(); c.translate(px, py); c.rotate(rot0 + d * 9 * (i % 2 ? 1 : -1)); c.scale(1, Math.cos(d * 12 + i)); c.fillRect(-sz, -sz * 0.5, sz * 2, sz); c.restore(); }
        else if (kind === 'glow') { c.drawImage(tinted(col), px - sz * 4, py - sz * 4, sz * 8, sz * 8); }
        else { c.fillStyle = col; c.beginPath(); c.arc(px, py, sz * (0.5 + 0.5 * fade), 0, 7); c.fill(); }
      }

    if (last) { const m = ez(t, t0 + 1.9, t0 + 2.4, 'out5'); c.save(); c.globalAlpha = appear; shape(c, m > 0.5 ? 'dot' : 'ring', gx, gy, mix(34, 22, m), m > 0.5 ? C.or : C.ink); c.restore(); return; }
    const x = mix(gx, cx, gone), y = mix(gy, cy, gone), s = 34 * (1 - gone);
    if (s > 0.5) { c.save(); c.globalAlpha = appear * e; shape(c, k, x, y, s, C.ink); c.restore(); }
  });
}

// =================================== THE SHOT ===================================
const PR = [
  { n: '05', a: 'Good design', b: 'is unobtrusive.', d: dUnobtrusive },
  { n: '06', a: 'Good design', b: 'is honest.', d: dHonest },
  { n: '10', a: 'Good design is as little', b: 'design as possible.', d: dLittle },
];
function shot(c, t, M) {
  HX.blit(c, paper(), 0, 0);
  const dr = drift(t, 0.4); c.save(); cam(c, W, H, { z: 1 + kick(t, KICK) + 0.02 * ez(t, 0, TL.D, 'sine'), x: dr.x, y: dr.y });
  grid(c, ez(t, 0, 0.8));
  // header row
  mono(c, 'DESIGN NOTES', COL(0), 70, 13, ez(t, 0.2, 0.8), { col: C.ink, w: 700, track: 4 });
  mono(c, 'ON DIETER RAMS', COL(4), 70, 13, ez(t, 0.3, 0.9), { track: 4 });
  mono(c, String(Math.min(10, TL.grid.lit.filter((x) => t >= x).length ? Number(PR[Math.max(0, TL.grid.lit.filter((x) => t >= x).length - 1)].n) : 0)).padStart(2, '0') + ' / 10', COL(12), 70, 13, ez(t, 5.9, 6.4), { align: 'right', col: C.ink, w: 700, track: 3 });
  // Q: the German line over a growing sand circle
  const Q = TL.q, cOut = ez(t, Q.out, Q.out + 0.8, 'io3');
  const cr = 240 * ez(t, Q.circle, Q.circle + 1.2, 'out5') * (1 - cOut); if (cr > 1) { c.fillStyle = C.sand; c.beginPath(); c.arc(COL(8), mix(380, 360, cOut), cr, 0, 7); c.fill(); }
  serif(c, 'Weniger, aber besser.', W / 2, 375, 104, t, Q.de, Q.out, { align: 'center' });
  mono(c, 'DIETER RAMS', W / 2, 440, 14, ez(t, Q.name, Q.name + 0.5) * (1 - ez(t, Q.out, Q.out + 0.4)), { align: 'center', col: C.ink, track: 6 });
  // EN: the translation
  const N = TL.en;
  rise(c, 'Less, but better.', W / 2, 400, 124, t, N.a, N.out, { w: 900, align: 'center', stagger: 0.12 });
  mono(c, 'HIS RULE FOR EVERYTHING HE DESIGNED', W / 2, 470, 14, ez(t, N.b + 0.5, N.b + 0.9) * (1 - ez(t, N.out, N.out + 0.3)), { track: 4, align: 'center' });
  // the ten principles as ten dots on the grid; the current one turns orange
  const G = TL.grid, ga = ez(t, G.dots, G.dots + 0.6, 'out5') * (1 - ez(t, TL.end.dot - 0.2, TL.end.dot + 0.3));
  if (ga > 0) for (let i = 0; i < 10; i++) {
    const x = COL(i + 1) + 4, y = H - 120, which = [4, 5, 9].indexOf(i), on = which >= 0 && t >= G.lit[which] && (which === 2 || t < G.lit[which + 1]), seen = which >= 0 && t >= G.lit[which];
    const e = ez(t, G.dots + i * 0.04, G.dots + i * 0.04 + 0.4, 'out5') * ga; if (e <= 0) continue;
    c.save(); c.globalAlpha = e; c.fillStyle = on ? C.or : seen ? C.ink : 'transparent'; c.strokeStyle = on ? C.or : C.ink; c.lineWidth = 1.5; c.beginPath(); c.arc(x, y, on ? 9 : 6, 0, 7); if (on || seen) c.fill(); else c.stroke(); c.restore();
    mono(c, String(i + 1).padStart(2, '0'), x, y + 30, 11, e * (on ? 1 : 0.6), { align: 'center', col: on ? C.or : C.mid, track: 1 });
  }
  // the three principles
  PR.forEach((p, i) => {
    const T0 = TL.p[i].t, T1 = TL.p[i].out; if (t < T0 - 0.1 || t > T1 + 0.7) return;
    const o = ez(t, T1, T1 + 0.5, 'in3');
    mono(c, 'PRINCIPLE ' + p.n, COL(1), 200, 14, ez(t, T0, T0 + 0.4) * (1 - o), { col: C.or, w: 700, track: 4 });
    rise(c, p.a, COL(1), 300, i === 2 ? 62 : 78, t, T0 + 0.1, T1);
    rise(c, p.b, COL(1), i === 2 ? 372 : 386, i === 2 ? 62 : 78, t, T0 + 0.25, T1);
    c.save(); c.globalAlpha = 1 - o; p.d(c, t, T0, COL(9) + 20, 330); c.restore();
  });
  // end: everything reduces to one orange dot
  const F = TL.end, de = ez(t, F.dot, F.dot + 0.6, 'out5');
  if (de > 0) { const x = mix(COL(9) + 20, COL(1) + 10, ez(t, F.dot + 0.3, F.dot + 1.0, 'io3')), y = mix(330, 230, ez(t, F.dot + 0.3, F.dot + 1.0, 'io3')); c.fillStyle = C.or; c.beginPath(); c.arc(x, y, mix(22, 14, de), 0, 7); c.fill(); }
  rise(c, 'Less,', COL(1), 380, 128, t, F.a, null, { w: 900 });
  rise(c, 'but better.', COL(1), 500, 128, t, F.b, null, { w: 900 });
  mono(c, 'SWISS ABSTRACT · HARIS AI MOTION STYLES', COL(1), 590, 13, ez(t, F.sig, F.sig + 0.6), { col: C.ink, track: 4 });
  mono(c, 'theharisai.com/styles', COL(1), 616, 13, ez(t, F.sig + 0.2, F.sig + 0.8), { track: 1 });
  if (M.shot) { const e = ez(t, F.a, F.a + 0.8, 'out5'); if (e > 0) { const x = COL(7), y = 170, w = COL(12) - COL(7), h = 330; c.save(); c.globalAlpha = e; c.fillStyle = C.ink; c.fillRect(x + 10, y + 10 + (1 - e) * 20, w, h); MEDIA.shot(c, x, y + (1 - e) * 20, w, h, { r: 0, tint: '#2b2b2b' }); c.restore(); mono(c, 'FIG. 1 · YOUR PRODUCT', x, y + h + 34, 12, e, { col: C.ink, track: 3 }); } }
  c.restore();
}

// =================================== OVERLAY ===================================
function overlay(c, t, M) {
  if (M.face) { const a = ez(t, 5.8, 6.4, 'out5') * (1 - ez(t, 15.4, 15.8)); if (a > 0) { const r = 78, x = COL(11) - 10, y = 190; c.save(); c.globalAlpha = a; MEDIA.face(c, x - r, y - r, r * 2, r * 2, { shape: 'circle', tint: '#8a7f6a' }); c.strokeStyle = C.ink; c.lineWidth = 1.5; c.beginPath(); c.arc(x, y, r + 8, 0, 7); c.stroke(); c.restore(); mono(c, 'IN CONVERSATION', x, y + r + 34, 11, a, { align: 'center', track: 3 }); } }
  fx.grain(c, t, W, H, 0.06, 12, 'multiply');
}

// =================================== SOUND ===================================
function score(k) {
  const Q = TL.q, N = TL.en, G = TL.grid, F = TL.end;
  const CH = [['F2', ['F3', 'A3', 'C4', 'E4']], ['D2', ['D3', 'F3', 'A3', 'C4']], ['A#1', ['A#2', 'D3', 'F3', 'A3']], ['C2', ['C3', 'E3', 'G3', 'B3']]];
  k.beat(0.1, TL.D - 0.1, { style: 'lux', bpm: 76, gain: 1.15, chords: CH });
  k.play('swell', 0, { d: Q.de, gain: 0.4 }); k.play('thump', Q.circle + 0.1, { gain: 0.35, soft: true });
  k.play('swish', Q.de, { d: 0.8, gain: 0.25, top: 1600, soft: true }); k.play('bell', Q.name, { hz: 'A5', gain: 0.55 });
  k.play('swish', Q.out, { d: 0.6, gain: 0.25, dir: -1, soft: true });
  k.play('hit', N.a, { gain: 0.6 }); k.play('hit', N.b, { gain: 0.75 }); k.play('thump', N.b + 0.05, { gain: 0.5 });
  for (let i = 0; i < 10; i++) k.play('tick', G.dots + i * 0.04, { hz: 3000 + i * 90, gain: 0.25, soft: true });
  G.lit.forEach((t, i) => { k.play('click', t, { gain: 0.8 }); k.play('bell', t + 0.05, { hz: ['C6', 'E6', 'G6'][i], gain: 0.45 }); k.play('hit', t + 0.15, { gain: 0.45 }); });
  k.play('pop', TL.p[0].t + 1.3, { hz: 300, gain: 0.4 });
  k.play('thump', TL.p[1].t + 1.6, { gain: 0.5 }); k.play('chime', TL.p[1].t + 2.05, { notes: ['E6', 'B6'], gain: 0.6 });
  for (let i = 0; i < 8; i++) k.play('tick', TL.p[2].t + 1.0 + i * 0.13 + 0.3, { hz: 2400 - i * 120, gain: 0.35 });
  k.play('pop', TL.p[2].t + 2.1, { hz: 620, gain: 0.6 });
  k.play('pop', F.dot, { hz: 520, gain: 0.6 }); k.play('hit', F.a, { gain: 0.7 }); k.play('hit', F.b, { gain: 0.8 }); k.play('bell', F.b + 0.05, { hz: 'F5', gain: 0.7 });
}

const STYLE = {
  name: 'Swiss Abstract', family: 'Minimal Type', W, H, D: TL.D, base: C.paper, poster: 11.9,
  fonts: ['900 60px "Inter Tight"', '800 60px "Inter Tight"', 'italic 400 60px "Instrument Serif"', '500 20px "JetBrains Mono"', '700 20px "JetBrains Mono"'],
  scenes: [{ draw: shot }], cuts: [], overlay, score,
};

</script>
<script>
// ---------------------------------------------- PLAYER ------------------------------------------------
// Exposes: window.seek(t), window.seekAsync(t), window.DURATION, window.STYLE, window.score(k), window.SND,
//          window.renderAudio(opts), window.setOptions({ face, shot }), window.loadFacecam(url), window.loadScreenshot(url),
//          window.captureFrame(t, { fps, sub, shutter, type, quality }) -> data URL of one motion-blurred frame
// Render scale: ?res=1 in the page hash or STYLE.res; default 1.5 (1920x1080 from a 1280x720 style).
(() => {
  const S = STYLE, cv = document.getElementById('stage'), ctx = cv.getContext('2d', { alpha: false });
  const hr = /res=([\d.]+)/.exec(location.hash); HX.R = hr ? +hr[1] : S.res || 1.5;
  cv.width = Math.round(S.W * HX.R); cv.height = Math.round(S.H * HX.R); ctx.imageSmoothingQuality = 'high'; if (S.H > S.W) document.getElementById('wrap').classList.add('tall');
  const M = { face: false, shot: false };
  const D = S.D;
  window.DURATION = D; window.STYLE = S; window.SND = SND; window.OPTIONS = M;
  window.seek = (t) => { t = HX.cl(t, 0, D); STAGE.frame(ctx, S, t, M); };
  window.seekAsync = async (t) => { await MEDIA.seekVideo(t); window.seek(t); };
  window.score = (k) => S.score(k, M);
  window.renderAudio = (o = {}) => SND.render(window.score, D, 48000, o);
  // motion blur: average `sub` sub-frames spread over the shutter (0.5 = 180 degrees) of one output frame
  let ACC = null;
  window.captureFrame = async (t, o = {}) => {
    const fps = o.fps || 60, sub = o.sub || 1, sh = o.shutter == null ? 0.5 : o.shutter;
    if (sub <= 1) { await window.seekAsync(t); return cv.toDataURL(o.type || 'image/jpeg', o.quality || 0.95); }
    if (!ACC || ACC.width !== cv.width || ACC.height !== cv.height) ACC = HX.canvas(cv.width, cv.height);
    const a = ACC.getContext('2d'); a.setTransform(1, 0, 0, 1, 0, 0);
    for (let k = 0; k < sub; k++) { const tt = Math.min(D, t + ((k / (sub - 1)) - 0.5) * sh / fps); await window.seekAsync(Math.max(0, tt)); a.globalAlpha = 1 / (k + 1); a.globalCompositeOperation = k ? 'source-over' : 'copy'; a.drawImage(cv, 0, 0); }
    a.globalAlpha = 1; return ACC.toDataURL(o.type || 'image/jpeg', o.quality || 0.95);
  };

  const $ = (id) => document.getElementById(id);
  const ui = { play: $('play'), scrub: $('scrub'), time: $('time'), sound: $('sound'), loop: $('loop'), faceOn: $('faceOn'), shotOn: $('shotOn'), vo: $('vofile'), face: $('facefile'), shot: $('shotfile'), note: $('note') };
  ui.scrub.max = D;
  let T = 0, playing = false, last = 0, soundOn = true, loopOn = true, stop = null, vo = null;
  const fmt = (t) => t.toFixed(2) + ' / ' + D.toFixed(2);
  const narrated = () => !!vo || !!(MEDIA.st.face && M.face);
  function draw() { MEDIA.sync(T, playing); window.seek(T); ui.scrub.value = T; ui.time.textContent = fmt(T); }
  function stopAudio() { if (stop) { stop(); stop = null; } if (vo) vo.pause(); }
  function startAudio() {
    stopAudio(); if (!playing) return;
    if (soundOn) stop = SND.live(window.score, T, { vo: narrated() });
    if (vo) { try { vo.currentTime = T; if (soundOn) vo.play().catch(() => {}); } catch (e) {} }
    const v = MEDIA.st.face; if (v) { v.muted = !soundOn || !!vo || !M.face; try { v.currentTime = Math.min(T, (v.duration || 1e9) - 0.03); } catch (e) {} }
  }
  function setPlaying(p) { playing = p; ui.play.textContent = p ? 'Pause' : 'Play'; last = performance.now(); if (p) startAudio(); else { stopAudio(); MEDIA.sync(T, false); } }
  function tick(now) {
    if (playing) { T += (now - last) / 1000; last = now; if (T >= D) { if (loopOn) { T = 0; startAudio(); } else { T = D; setPlaying(false); } } draw(); }
    requestAnimationFrame(tick);
  }
  const press = (b, on) => b.setAttribute('aria-pressed', on ? 'true' : 'false');
  window.setOptions = (o) => { if ('face' in o) M.face = !!o.face; if ('shot' in o) M.shot = !!o.shot; press(ui.faceOn, M.face); press(ui.shotOn, M.shot); draw(); if (playing) startAudio(); };
  window.loadFacecam = (url) => new Promise((res) => { const v = document.createElement('video'); v.src = url; v.playsInline = true; v.muted = true; v.preload = 'auto'; v.crossOrigin = 'anonymous'; v.addEventListener('loadeddata', () => { MEDIA.st.face = v; window.setOptions({ face: true }); res(v); }, { once: true }); v.load(); });
  window.loadScreenshot = (url) => new Promise((res) => { const im = new Image(); im.onload = () => { MEDIA.st.shot = im; window.setOptions({ shot: true }); res(im); }; im.src = url; });

  ui.play.addEventListener('click', () => { if (!playing && T >= D) T = 0; setPlaying(!playing); });
  ui.scrub.addEventListener('input', () => { T = parseFloat(ui.scrub.value); draw(); if (playing) startAudio(); });
  ui.sound.addEventListener('click', () => { soundOn = !soundOn; press(ui.sound, soundOn); ui.sound.textContent = soundOn ? 'Sound on' : 'Sound off'; if (playing) startAudio(); });
  ui.loop.addEventListener('click', () => { loopOn = !loopOn; press(ui.loop, loopOn); });
  ui.faceOn.addEventListener('click', () => window.setOptions({ face: !M.face }));
  ui.shotOn.addEventListener('click', () => window.setOptions({ shot: !M.shot }));
  ui.vo.addEventListener('change', () => { const f = ui.vo.files && ui.vo.files[0]; if (!f) return; if (vo) { vo.pause(); URL.revokeObjectURL(vo.src); } vo = new Audio(URL.createObjectURL(f)); ui.note.textContent = 'Voiceover loaded: ' + f.name + '. Effects switch to the lighter mix.'; if (playing) startAudio(); });
  ui.face.addEventListener('change', async () => { const f = ui.face.files && ui.face.files[0]; if (!f) return; await window.loadFacecam(URL.createObjectURL(f)); ui.note.textContent = 'Facecam loaded: ' + f.name + '. It plays from 0:00 in sync with the timeline.'; if (playing) startAudio(); });
  ui.shot.addEventListener('change', async () => { const f = ui.shot.files && ui.shot.files[0]; if (!f) return; await window.loadScreenshot(URL.createObjectURL(f)); ui.note.textContent = 'Screenshot loaded: ' + f.name + '. It appears in the Brand UI scene.'; });
  document.addEventListener('keydown', (e) => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); ui.play.click(); } });

  (async () => {
    try { await Promise.all((S.fonts || []).map((f) => document.fonts.load(f, 'AaZz09'))); await document.fonts.ready; } catch (e) {}
    if (!/nowarm/.test(location.hash)) STAGE.warm(ctx, S, M, 0.2); if (!/nowarm/.test(location.hash)) { window.setOptions({ face: true, shot: true }); STAGE.warm(ctx, S, M, 0.5); window.setOptions({ face: false, shot: false }); }
    T = S.poster == null ? Math.min(2, D) : S.poster; draw(); window.__ready = true;
    requestAnimationFrame((n) => { last = n; tick(n); });
  })();
})();

</script>
