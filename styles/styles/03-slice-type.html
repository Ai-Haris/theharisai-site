<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slice Type</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=JetBrains+Mono:wght@500;700&family=DM+Sans:wght@500;700&display=block">
<style>
/* Layout: a single-column studio player. Stage first, transport under it, then the "make it yours" media row. One dark look by choice. */
:root {
  color-scheme: dark;
  --bg: #0d0d11;
  --panel: #16161c;
  --ink: #f2f0eb;
  --dim: #9896a2;
  --line: #2b2a33;
  --accent: #ff3b2f;
  --on-accent: #ffffff;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); margin: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 28px; }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 14px; }
.wrap.tall { max-width: 520px; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.top h1 { margin: 0; font-size: clamp(22px, 3.4vw, 32px); line-height: 1.1; letter-spacing: -0.01em; }
.top h1 span { color: var(--accent); }
.meta { margin: 0; color: var(--dim); font-size: 14px; }
.stage { position: relative; width: 100%; max-width: 100%; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.stage canvas { display: block; width: 100%; height: auto; }
.bar, .mine { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.mine .lab { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); margin-right: 4px; }
button, label.btn { font: 600 14px var(--ui); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
button:hover, label.btn:hover { border-color: var(--dim); }
button:focus-visible, label.btn:focus-within, input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
#play { min-width: 84px; justify-content: center; background: var(--ink); color: #0d0d11; border-color: var(--ink); }
#scrub { flex: 1 1 200px; min-width: 0; accent-color: var(--accent); }
#time { font: 600 14px var(--ui); font-variant-numeric: tabular-nums; color: var(--dim); min-width: 96px; text-align: right; }
.file { position: absolute; width: 1px; height: 1px; opacity: 0; }
.note { margin: 0; color: var(--dim); font-size: 13px; max-width: 75ch; line-height: 1.5; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="wrap" id="wrap">
  <div class="top">
    <h1>Slice <span>Type</span></h1>
    <p class="meta" id="meta">Kinetic Type · drawn in code, sound synthesized · HX engine</p>
  </div>
  <div class="stage"><canvas id="stage" width="1280" height="720" aria-label="Slice Type animation"></canvas></div>
  <div class="bar">
    <button id="play" type="button">Play</button>
    <input id="scrub" type="range" min="0" max="20" step="0.01" value="0" aria-label="Scrub timeline">
    <span id="time">0.00 / 0.00</span>
    <button id="sound" type="button" aria-pressed="true">Sound on</button>
    <button id="loop" type="button" aria-pressed="true">Loop</button>
  </div>
  <div class="mine">
    <span class="lab">Make it yours</span>
    <button id="faceOn" type="button" aria-pressed="false">Facecam</button>
    <button id="shotOn" type="button" aria-pressed="false">Brand UI</button>
    <label class="btn" for="vofile">Load voiceover<input class="file" id="vofile" type="file" accept="audio/*"></label>
    <label class="btn" for="facefile">Load facecam<input class="file" id="facefile" type="file" accept="video/*"></label>
    <label class="btn" for="shotfile">Load screenshot<input class="file" id="shotfile" type="file" accept="image/*"></label>
  </div>
  <p class="note" id="note">Turn on Facecam or Brand UI to see where your camera and your own screenshot go. Load your files to preview them in sync. A facecam clip with sound also works as the voiceover.</p>
</div>

<script>
/* =====================================================================================================
   HX MOTION ENGINE v1.1  ·  Haris AI Style Library  ·  theharisai.com
   A small engine for code-drawn animated videos. Every frame is a pure function of time t.
   Sections:  1 HX (math, random, easing, text, shapes, finishing)   2 SND (synthesized sound + music)
              3 MEDIA (facecam + brand screenshot slots)             4 STAGE (scene compositor + transitions)
   A style only defines one STYLE object (see the STYLE block). The PLAYER block wires the page.
   Rule: never use Math.random. All randomness comes from HX.rand(seed) and HX.noise(seed).
   v1.1: render scale HX.R (1.5 = 1920x1080 from 1280x720 logic). Cached layers use HX.layer(w, h) and are drawn with
         HX.blit(c, L, x, y[, w, h]) so they stay sharp. New finishing fx: bloom, leak, bokeh, burst, ring, flare, drift.
   ===================================================================================================== */

// ----------------------------------------------- 1 · HX -----------------------------------------------
const HX = (() => {
  const cl = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));
  const mix = (a, b, u) => a + (b - a) * u;

  const bell = (t, a, b) => Math.sin(Math.PI * prog(t, a, b));

  const rand = (seed) => {
    let a = fnv('a' + seed), b = fnv('b' + seed), c = fnv('c' + seed), d = 1;
    const f = () => { a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0; let t = (a + b) | 0; a = b ^ (b >>> 9); b = (c + (c << 3)) | 0; c = (c << 21) | (c >>> 11); d = (d + 1) | 0; t = (t + d) | 0; c = (c + t) | 0; return (t >>> 0) / 4294967296; };

    f.range = (lo, hi) => lo + f() * (hi - lo); f.pick = (arr) => arr[Math.floor(f() * arr.length)]; f.sign = () => (f() < 0.5 ? -1 : 1);

  const fade = (u) => u * u * u * (u * (u * 6 - 15) + 10);
  const lattice = (x, y, s) => { let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ s; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  const noise = (seed = 0) => { const s = fnv('n' + seed); return (x, y = 0) => { const xi = Math.floor(x), yi = Math.floor(y), u = fade(x - xi), v = fade(y - yi); return mix(mix(lattice(xi, yi, s), lattice(xi + 1, yi, s), u), mix(lattice(xi, yi + 1, s), lattice(xi + 1, yi + 1, s), u), v) * 2 - 1; }; };
  const E = {
    lin: (u) => u,
    sine: (u) => 0.5 - 0.5 * Math.cos(Math.PI * u),
    out2: (u) => 1 - (1 - u) * (1 - u),
    out3: (u) => 1 - Math.pow(1 - u, 3),
    in3: (u) => u * u * u,
    io3: (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(2 - 2 * u, 3) / 2),
    out5: (u) => 1 - Math.pow(1 - u, 5),
    expo: (u) => (u >= 1 ? 1 : 1 - Math.pow(2, -11 * u)),
    ioExpo: (u) => (u <= 0 ? 0 : u >= 1 ? 1 : u < 0.5 ? Math.pow(2, 20 * u - 10) / 2 : (2 - Math.pow(2, -20 * u + 10)) / 2),
    over: (u, k = 1.8) => { if (u <= 0) return 0; if (u >= 1) return 1; const v = u - 1; return 1 + v * v * ((k + 1) * v + k); },
    spring: (u, f = 12, d = 5.5) => (u <= 0 ? 0 : u >= 1 ? 1 : 1 - Math.exp(-d * u) * Math.cos(f * u)),
    bounce: (u) => { const n = 7.5625, k = 2.75; if (u < 1 / k) return n * u * u; if (u < 2 / k) return n * (u -= 1.5 / k) * u + 0.75; if (u < 2.5 / k) return n * (u -= 2.25 / k) * u + 0.9375; return n * (u -= 2.625 / k) * u + 0.984375; },
  };

  const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };

  const layer = (w, h) => { const R = API.R, c = canvas(w * R, h * R); c.lw = w; c.lh = h; c.getContext('2d').setTransform(R, 0, 0, R, 0, 0); return c; };
  const blit = (c, L, x, y, w, h) => c.drawImage(L, x, y, w == null ? (L.lw || L.width) : w, h == null ? (L.lh || L.height) : h);

  const blitPart = (c, L, sx, sy, sw, sh, dx, dy, dw, dh) => { const k = L.lw ? L.width / L.lw : 1; c.drawImage(L, sx * k, sy * k, sw * k, sh * k, dx, dy, dw, dh); };

    rr: (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); },
    poly: (c, pts) => { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath(); },
    ngon: (c, cx, cy, r, n, rot = 0) => { c.beginPath(); for (let i = 0; i < n; i++) { const a = rot + (i / n) * Math.PI * 2; i ? c.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r) : c.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } c.closePath(); },
    star: (c, cx, cy, ro, ri, n, rot = -Math.PI / 2) => { c.beginPath(); for (let i = 0; i < n * 2; i++) { const a = rot + (i * Math.PI) / n, r = i % 2 ? ri : ro; i ? c.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r) : c.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } c.closePath(); },
  };

    font: (weight, px, family) => `${weight} ${px}px ${family}`,
    width: (c, s, font, track = 0) => { c.font = font; c.letterSpacing = track + 'px'; const w = c.measureText(s).width; c.letterSpacing = '0px'; return w; },
    // draw text with options { font, fill, stroke, lw, align, base, track, alpha }
    draw: (c, s, x, y, o) => {
      c.save(); c.font = o.font; c.letterSpacing = (o.track || 0) + 'px'; c.textAlign = o.align || 'center'; c.textBaseline = o.base || 'middle';
      if (o.alpha != null) c.globalAlpha *= o.alpha;
      if (o.stroke) { c.lineJoin = 'round'; c.lineWidth = o.lw || 4; c.strokeStyle = o.stroke; c.strokeText(s, x, y); }
      if (o.fill) { c.fillStyle = o.fill; c.fillText(s, x, y); }
      c.restore();
    },
    // largest px (up to max) at which s fits width w
    fit: (c, s, w, max, weight, family, track = 0) => { const at = txt.width(c, s, `${weight} 100px ${family}`, track * 1); return Math.min(max, Math.floor((100 * w) / Math.max(1, at))); },
    // per-letter layout: returns [{ ch, x (center offset from the word's left edge), w }] and total width
    letters: (c, s, font, track = 0) => { c.font = font; c.letterSpacing = '0px'; let x = 0; const out = []; for (const ch of s) { const w = c.measureText(ch).width; out.push({ ch, x: x + w / 2, w }); x += w + track; } c.letterSpacing = '0px'; return { list: out, w: x - track }; },
    wrap: (c, s, font, maxW) => { c.font = font; const out = []; let line = ''; for (const w of s.split(' ')) { const test = line ? line + ' ' + w : w; if (c.measureText(test).width > maxW && line) { out.push(line); line = w; } else line = test; } if (line) out.push(line); return out; },
  };
  let GR = null; const SM = {}; let SOFT = null;
  const small = (k, w, h) => { const c = SM[k]; if (c && c.width === w && c.height === h) return c; return (SM[k] = canvas(w, h)); };
  // soft round sprite (white), used for bokeh, glows and particles
  const soft = () => { if (SOFT) return SOFT; SOFT = canvas(128, 128); const x = SOFT.getContext('2d'), g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.35, 'rgba(255,255,255,0.55)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 128, 128); return SOFT; };
  const TINT = new Map();
  const tinted = (col) => { if (TINT.has(col)) return TINT.get(col); const L = canvas(128, 128), x = L.getContext('2d'); x.drawImage(soft(), 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = col; x.fillRect(0, 0, 128, 128); TINT.set(col, L); return L; };
  const fx = {
    // film or print grain, stepped at fps
    grain: (c, t, W, H, alpha = 0.06, fps = 12, mode = 'overlay') => {
      if (!GR) { GR = []; for (let g = 0; g < 3; g++) { const L = canvas(256, 256), x = L.getContext('2d'), img = x.createImageData(256, 256), r = rand('grain' + g); for (let i = 0; i < img.data.length; i += 4) { const v = 128 + (r() + r() - 1) * 115; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; } x.putImageData(img, 0, 0); GR.push(L); } }
      const f = Math.floor(t * fps), r = rand('gs' + f), pat = c.createPattern(GR[f % 3], 'repeat');
      pat.setTransform(new DOMMatrix().scaleSelf(1 / API.R).translateSelf(-r() * 256, -r() * 256));
      c.save(); base(c); c.globalAlpha = alpha; c.globalCompositeOperation = mode; c.fillStyle = pat; c.fillRect(0, 0, W, H); c.restore();
    },
    vignette: (c, W, H, strength = 0.35, color = '0,0,0') => {
      const g = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.6);
      g.addColorStop(0, `rgba(${color},0)`); g.addColorStop(1, `rgba(${color},${strength})`);
      c.save(); base(c); c.fillStyle = g; c.fillRect(0, 0, W, H); c.restore();
    },
    flash: (c, t, W, H, list) => { for (const f of list) { const d = t - f.t; if (d < 0 || d > 0.45) continue; c.save(); base(c); c.fillStyle = `rgba(${f.col || '255,255,255'},${f.a * Math.exp(-d * 10)})`; c.fillRect(0, 0, W, H); c.restore(); } },
    // bloom: bright parts glow. o = { strength, radius, lift (how much midtones glow, 0..1), mode }
    bloom: (c, o = {}) => {
      const cv = c.canvas, st = o.strength == null ? 0.55 : o.strength, rad = o.radius || 16, lift = o.lift == null ? 0.35 : o.lift;
      const w1 = Math.max(8, Math.round(cv.width / 4)), h1 = Math.max(8, Math.round(cv.height / 4)), A = small('b1', w1, h1), a = A.getContext('2d');
      const thr = `brightness(${0.55 + lift * 0.5}) contrast(${2.6 - lift * 1.4}) saturate(1.25)`;
      a.setTransform(1, 0, 0, 1, 0, 0); a.globalCompositeOperation = 'copy'; a.filter = `${thr} blur(${(rad / 4) * (cv.width / 1280)}px)`; a.drawImage(cv, 0, 0, w1, h1); a.filter = 'none';
      const w2 = Math.max(4, w1 >> 1), h2 = Math.max(4, h1 >> 1), B = small('b2', w2, h2), b = B.getContext('2d');
      b.setTransform(1, 0, 0, 1, 0, 0); b.globalCompositeOperation = 'copy'; b.filter = `blur(${(rad / 6) * (cv.width / 1280)}px)`; b.drawImage(A, 0, 0, w2, h2); b.filter = 'none';
      c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = o.mode || 'screen'; c.globalAlpha = st; c.drawImage(A, 0, 0, cv.width, cv.height); c.globalAlpha = st * 0.8; c.drawImage(B, 0, 0, cv.width, cv.height); c.restore();

    // drifting colored light leaks. cols: ['255,120,80', ...]
    leak: (c, t, W, H, cols, a = 0.25, seed = 'leak') => {

    // floating out-of-focus particles for depth. o = { n, col, min, max, speed, alpha, seed, mode }

    // particle burst at hit time t0 from (x, y). Pure function of t.

    burst: (c, t, t0, x, y, o = {}) => {

      c.save(); c.globalCompositeOperation = o.mode || (kind === 'confetti' ? 'source-over' : 'lighter'); c.lineCap = 'round';

        if (d > li) continue; const e = (1 - Math.exp(-k * d)) / k, px = x + Math.cos(a) * v * e, py = y + Math.sin(a) * v * e + 0.5 * g * d * d * 0.6, fade = 1 - d / li;
        const vx = Math.cos(a) * v * Math.exp(-k * d), vy = Math.sin(a) * v * Math.exp(-k * d) + g * d * 0.6;
        c.globalAlpha = fade;

        else if (kind === 'confetti') { c.fillStyle = col; c.save(); c.translate(px, py); c.rotate(rot0 + d * 9 * (i % 2 ? 1 : -1)); c.scale(1, Math.cos(d * 12 + i)); c.fillRect(-sz, -sz * 0.5, sz * 2, sz); c.restore(); }

        else { c.fillStyle = col; c.beginPath(); c.arc(px, py, sz * (0.5 + 0.5 * fade), 0, 7); c.fill(); }
      }

<script>
